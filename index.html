<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 80px; }
    form { display: flex; flex-direction: column; width: 260px; gap: 10px; }
    input { padding: 8px; }
    button { padding: 8px; cursor: pointer; }
    #message { text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>Đăng nhập</h2>
    <input type="text" id="username" placeholder="Tên đăng nhập" required>
    <input type="password" id="password" placeholder="Mật khẩu" required>
    <button type="submit">Đăng nhập</button>
    <p id="message"></p>
  </form>

  <script src="login.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const isValid = checkLogin(username, password);
      const message = document.getElementById('message');
      message.textContent = isValid ? 'Đăng nhập thành công!' : 'Sai tên đăng nhập hoặc mật khẩu!';
      message.style.color = isValid ? 'green' : 'red';
    });
  </script>
</body>
</html>
